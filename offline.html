<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>NEXUS · Offline</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #060c1c;
        font-family: 'Inter', system-ui, sans-serif;
        color: #94a3b8;
      }

      .card {
        text-align: center;
        padding: 48px 40px;
        background: rgba(8, 15, 30, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 20px;
        max-width: 340px;
        width: calc(100vw - 32px);
        box-shadow: 0 32px 72px rgba(0, 0, 0, 0.65);
      }

      .icon {
        font-size: 2.5rem;
        margin-bottom: 20px;
        filter: grayscale(0.3);
      }

      h1 {
        font-size: 1.15rem;
        font-weight: 700;
        color: #e2e8f0;
        letter-spacing: -0.01em;
        margin-bottom: 10px;
      }

      p {
        font-size: 0.82rem;
        line-height: 1.65;
        color: rgba(148, 163, 184, 0.7);
        margin-bottom: 28px;
      }

      button {
        background: #2563eb;
        border: none;
        border-radius: 10px;
        color: #fff;
        font-size: 0.85rem;
        font-weight: 600;
        padding: 10px 24px;
        cursor: pointer;
        transition: background 0.15s, transform 0.15s;
      }
      button:hover { background: #1d4ed8; transform: translateY(-1px); }
      button:active { transform: translateY(0); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📡</div>
      <h1>You're offline</h1>
      <p>
        NEXUS can't reach the network right now.<br>
        Cached pages are still available — check back when you're connected.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
