<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="NEXUS — your unified personal command hub for tracking missions, mastery, streaks, and time." />
    <meta property="og:title" content="NEXUS · COMMAND HUB" />
    <meta property="og:description" content="Unified personal command hub for missions, mastery, and time tracking." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="favicon/apple-touch-icon.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="NEXUS · COMMAND HUB" />
    <meta name="twitter:description" content="Unified personal command hub for missions, mastery, and time tracking." />
    <link rel="icon" type="image/x-icon" href="favicon/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png" />
    <link rel="manifest" href="favicon/site.webmanifest" />
    <title>NEXUS · COMMAND HUB</title>

    <!-- Fonts: all three views combined -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:ital@1&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
      integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkw=="
      crossorigin="anonymous"
    />

    <!-- All view CSS loaded upfront; inactive views set to media="not all" by router -->
    <link rel="stylesheet" href="css/index.css" data-view="nexus" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/vanguard.css" data-view="vanguard" media="not all" />
    <link rel="stylesheet" href="css/mastery.css" data-view="mastery" media="not all" />

    <script type="importmap">
    {
      "imports": {
        "appwrite": "https://esm.sh/appwrite@25"
      }
    }
    </script>
    <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js')</script>
  </head>
  <body>

    <!-- ══ AUTH OVERLAY — always in DOM, managed by router.js ══ -->
    <div id="authOverlay">
      <div class="aw-card">
        <div class="aw-logo-wrap">
          <i class="fa-solid fa-layer-group"></i>
        </div>
        <h2 class="aw-title">Sign in to NEXUS</h2>
        <p class="aw-subtitle">Your unified command hub</p>
        <div class="aw-field-group">
          <input id="overlayEmail" type="email" placeholder="Email" autocomplete="username email" />
          <div class="aw-field-sep"></div>
          <input id="overlayPassword" type="password" placeholder="Password" autocomplete="current-password" />
        </div>
        <div id="authOverlayError"></div>
        <button id="overlaySignIn" class="aw-btn" type="button">
          <span>Sign In</span>
        </button>
        <p class="aw-footer-note">Protected by Appwrite &middot; NEXUS Command Hub</p>
      </div>
    </div>

    <!-- Cloud sync toast — always present so appwrite-sync.js can find it -->
    <div id="nexusToast"></div>

    <!-- View container — router renders each view here -->
    <div id="app"></div>

    <script src="js/storage.js"></script>
    <script type="module" src="js/router.js"></script>

    <!-- file:// guard — runs even when modules fail to load -->
    <script>
      (function () {
        if (location.protocol !== 'file:') return
        document.addEventListener('DOMContentLoaded', function () {
          var err = document.getElementById('authOverlayError')
          var btn = document.getElementById('overlaySignIn')
          if (err) {
            err.innerHTML =
              '<strong>Cannot sign in from file://</strong><br>' +
              'Open Terminal and run:<br>' +
              '<code style="background:rgba(0,212,255,0.1);padding:2px 6px;border-radius:3px;letter-spacing:0.05em">' +
              'python3 -m http.server 8080</code><br>' +
              'Then open <strong>http://localhost:8080</strong>'
            err.style.cssText = 'opacity:1;font-size:0.72rem;line-height:1.6'
          }
          if (btn) btn.disabled = true
        })
      })()
    </script>
  </body>
</html>
